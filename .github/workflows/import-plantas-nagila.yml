name: Importar fotografias botânicas para o EntreMarés
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-plantas-nagila.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Baixar, conferir e reduzir fotografias
        run: python tools/import-plantas-nagila.py
      - name: Criar branch com as imagens disponíveis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b assets/plantas-nagila-20261101
          git add frontend/assets/plantas-nagila/ docs/RELATORIO_IMAGENS_PLANTAS_NAGILA.json
          git commit -m "Armazena imagens botânicas da pesquisa em WebP"
          git push origin HEAD:refs/heads/assets/plantas-nagila-20261101
