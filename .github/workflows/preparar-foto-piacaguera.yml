name: Preparar fotografia da igreja de Piaçaguera

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/preparar-foto-piacaguera.yml

permissions:
  contents: write

jobs:
  fotografia:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos do projeto
        uses: actions/checkout@v4

      - name: Instalar utilitários de imagem
        run: python -m pip install --quiet pymupdf Pillow requests

      - name: Extrair fotografia sem pessoas da cartilha da Portos do Paraná
        shell: bash
        run: |
          python - <<'PY'
          import io
          from pathlib import Path
          import requests
          import fitz
          from PIL import Image, ImageDraw

          source = "https://www.portosdoparana.pr.gov.br/sites/portos/arquivos_restritos/files/documento/2021-08/appa_-_pga_-_pcs_-_cartilha_das_comunidades.pdf"
          response = requests.get(source, timeout=65, headers={"User-Agent": "Mozilla/5.0 EntreMaresEducationalArchive/1.0"})
          response.raise_for_status()
          assert response.content.startswith(b"%PDF"), "O arquivo recebido não é um PDF"
          doc = fitz.open(stream=response.content, filetype="pdf")
          assert len(doc) >= 12, "A cartilha mudou de paginação"

          # Página 12 (índice 11): fotografia circular da igreja sem visitantes.
          # Região conferida no documento da Portos do Paraná. A fotografia não
          # é manipulada para eliminar pessoas; apenas é extraída da publicação.
          page = doc[11]
          w, h = page.rect.width, page.rect.height
          region = fitz.Rect(w*0.738, h*0.296, w*0.975, h*0.467)
          pix = page.get_pixmap(matrix=fitz.Matrix(5, 5), clip=region, alpha=False)
          im = Image.open(io.BytesIO(pix.tobytes("png"))).convert("RGBA")
          # O recorte original é circular; mantemos seu enquadramento.
          side = min(im.size)
          left = (im.width-side)//2
          top = (im.height-side)//2
          im = im.crop((left,top,left+side,top+side))
          scale = 720 / side
          if scale < 1:
              im = im.resize((720,720), Image.Resampling.LANCZOS)
          mask = Image.new("L", im.size, 0)
          draw = ImageDraw.Draw(mask)
          pad = max(1,int(im.width*.012))
          draw.ellipse((pad,pad,im.width-pad,im.height-pad), fill=255)
          im.putalpha(mask)
          output = Path("frontend/assets/patrimonio/igreja-piacaguera-cartilha-2021.webp")
          output.parent.mkdir(parents=True,exist_ok=True)
          im.save(output, "WEBP", quality=89, method=6)
          assert output.stat().st_size > 10000, "A fotografia extraída está muito pequena"
          print("Foto preparada:", output, im.size, output.stat().st_size)
          PY

      - name: Salvar fotografia no repositório
        run: |
          git config user.name "entremares-assets[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/assets/patrimonio/igreja-piacaguera-cartilha-2021.webp
          git commit -m "Adiciona foto sem pessoas da igreja de Piaçaguera a partir de cartilha institucional"
          git push
