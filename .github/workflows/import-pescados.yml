name: Importar imagens de pescados para o repositório
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-pescados.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências de imagem
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Baixar e otimizar imagens indicadas
        run: python tools/import-pescados.py
      - name: Criar branch com imagens e relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b assets/pescados-locais-20261101
          git add frontend/assets/pescados/referencias/ docs/RELATORIO_IMPORTACAO_PESCADOS.json
          git commit -m "Armazena fotos de referência dos pescados em WebP"
          git push origin HEAD:refs/heads/assets/pescados-locais-20261101
