name: Importar novas imagens das plantas da professora Nágila
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-nagila-new-photos.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Baixar e comprimir fotografias
        run: python tools/import-nagila-new-photos.py
      - name: Salvar arquivos existentes em branch de revisão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b assets/nagila-fotos-fornecidas-20261101
          git add frontend/assets/plantas-nagila/revisadas/ docs/RELATORIO_IMAGENS_PLANTAS_NAGILA_ATUALIZADAS.json
          git commit -m "Importa imagens fornecidas das plantas em WebP"
          git push origin HEAD:refs/heads/assets/nagila-fotos-fornecidas-20261101
