name: Importar fotos de movimento pesqueiro e trapiche para Diego
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/importar-fotos-diego-20261102.yml
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Baixar e otimizar duas fotos de Wikimedia Commons
        run: python tools/importar-fotos-diego-20261102.py
      - name: Salvar fotografias e relatório em branch de revisão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b assets/diego-fotos-baixadas-20261102
          git add frontend/assets/reportagens/diego-movimento/ docs/RELATORIO_FOTOS_DIEGO_MOVIMENTO.json
          git commit -m "Armazena fotos de pesca e trapiche do Paraná para Diego"
          git push origin HEAD:refs/heads/assets/diego-fotos-baixadas-20261102
