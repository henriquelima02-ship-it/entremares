name: Importar fotografias de camarão-branco para capa de Josélia
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/importar-fotos-camarao-joselia.yml
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Importar e reduzir fotografias
        run: python tools/importar-fotos-camarao-joselia.py
      - name: Guardar imagens em branch de revisão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b assets/fotos-camarao-branco-joselia-20261102
          git add frontend/assets/atividades/camarao-branco/ docs/RELATORIO_FOTOS_CAMARAO_BRANCO_JOSELIA.json
          git commit -m "Armazena fotografias de Penaeus schmitti em WebP"
          git push origin HEAD:refs/heads/assets/fotos-camarao-branco-joselia-20261102
